<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">The Transfer That Never Happened</title>
<desc id="desc">Minh họa hồ sơ chuyển nhượng bị chặn, năm 1990, dẫn tới phán quyết Bosman năm 1995.</desc>
<defs>
  <radialGradient id="bg" cx=".82" cy=".22" r="1"><stop stop-color="#3e443a"/><stop offset=".6" stop-color="#1b2924"/><stop offset="1" stop-color="#121d19"/></radialGradient>
  <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f5efdf"/><stop offset="1" stop-color="#cec5b2"/></linearGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="16" dy="22" stdDeviation="20" flood-color="#050806" flood-opacity=".4"/></filter>
  <pattern id="lines" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0V72M0 72H72" fill="none" stroke="#c1d2be" opacity=".09"/></pattern>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#lines)"/>
<path d="M0 0H1200V8H0Z" fill="#ad634b"/>
<text x="82" y="92" fill="#e3ac90" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="7">HISTORY / JEAN-MARC BOSMAN</text>
<path d="M82 114H1112" stroke="#a8b4a6" opacity=".5"/>
<text x="77" y="260" fill="#f4f1e7" font-family="Georgia,serif" font-size="79" letter-spacing="-4">THE TRANSFER</text>
<text x="77" y="365" fill="#f4f1e7" font-family="Georgia,serif" font-size="79" letter-spacing="-4">THAT NEVER</text>
<text x="77" y="470" fill="#db8e72" font-family="Georgia,serif" font-style="italic" font-size="87" letter-spacing="-5">HAPPENED</text>
<text x="81" y="575" fill="#c8d0c4" font-family="Arial,sans-serif" font-size="26" letter-spacing="3">LIÈGE  —  DUNKERQUE</text>
<path d="M81 610H665" stroke="#a4b3a6" opacity=".5"/>
<text x="81" y="677" fill="#dbc0a9" font-family="Georgia,serif" font-size="40">1990</text><text x="185" y="677" fill="#84958a" font-family="Georgia,serif" font-size="38">/</text><text x="220" y="677" fill="#dbc0a9" font-family="Georgia,serif" font-size="40">1995</text>
<g transform="translate(790 206) rotate(8 140 225)" filter="url(#shadow)">
  <rect width="295" height="462" fill="url(#paper)"/>
  <path d="M23 32H271" stroke="#857d72" stroke-width="2"/>
  <text x="26" y="22" font-family="Arial,sans-serif" fill="#6a655c" font-size="11" letter-spacing="3">TRANSFER DOSSIER</text>
  <text x="25" y="92" font-family="Georgia,serif" fill="#252d28" font-size="54">BOSMAN</text>
  <text x="25" y="118" font-family="Arial,sans-serif" fill="#5f655f" font-size="14" letter-spacing="2">RFC LIÈGE</text>
  <path d="M26 159H266M26 203H266M26 247H266M26 291H266" stroke="#ada698" stroke-width="2"/>
  <text x="26" y="155" fill="#61675e" font-family="Arial,sans-serif" font-size="14">DESTINATION: DUNKERQUE</text>
  <text x="26" y="199" fill="#61675e" font-family="Arial,sans-serif" font-size="14">CONTRACT ENDED</text>
  <text x="26" y="243" fill="#61675e" font-family="Arial,sans-serif" font-size="14">YEAR: 1990</text>
  <g transform="translate(38 329) rotate(-11 100 38)">
    <rect width="221" height="76" rx="3" fill="none" stroke="#a64b3d" stroke-width="6"/>
    <text x="111" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#a64b3d" letter-spacing="2">TRANSFER</text>
    <text x="111" y="61" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#a64b3d" letter-spacing="2">BLOCKED</text>
  </g>
</g>
<text x="82" y="765" fill="#d6d3c6" opacity=".76" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">NOTES FROM N5</text>
</svg>